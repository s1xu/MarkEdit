name: Release

on:
  push:
    tags:
      - 'macos14-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to release'
        required: true
        default: 'macos14'

permissions:
  contents: write

jobs:
  release:
    name: Release MarkEdit
    runs-on: macos-15
    env:
      node-version: '20.x'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/yarn.lock'

      - name: Build CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install
          yarn build

      - name: Build MarkEditMac
        run: |
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package release assets
        run: |
          set -euo pipefail

          APP_PATH="$(xcodebuild -project MarkEdit.xcodeproj -scheme MarkEditMac -configuration Release -showBuildSettings | awk -F ' = ' '/TARGET_BUILD_DIR/ { dir=$2 } /FULL_PRODUCT_NAME/ { app=$2 } END { print dir "/" app }')"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")"

          mkdir -p release
          ditto -c -k --keepParent "$APP_PATH" "release/MarkEdit-macos14-${VERSION}-${BUILD}.app.zip"
          cat > release/ReleaseInfo.json <<EOF
          {
            "minOSVer": "${MIN_OS}"
          }
          EOF

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MarkEdit-macos14-*.app.zip
            release/ReleaseInfo.json
          generate_release_notes: true
          make_latest: true
